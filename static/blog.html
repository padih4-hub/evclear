<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YK28R0J0YM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YK28R0J0YM');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — EVClear</title>
<meta name="description" content="Honest EV guides, news, and advice for Australian buyers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root {
    --neon: #a8ff78;
    --dark: #0d0f0c;
    --dark2: #141714;
    --dark3: #1a1e19;
    --card: #181c17;
    --border: rgba(168,255,120,0.12);
    --text: #e8ede6;
    --muted: #7a8a76;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.7; overflow-x: hidden; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 48px; height: 68px; display: flex; align-items: center; justify-content: space-between; background: rgba(13,15,12,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.35rem; color: var(--white); text-decoration: none; }
  .logo span { color: var(--neon); }
  .nav-links { display: flex; align-items: center; gap: 36px; list-style: none; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
  .nav-links a:hover { color: var(--neon); }
  .nav-cta { background: var(--neon) !important; color: var(--dark) !important; padding: 8px 20px; border-radius: 6px; font-weight: 500 !important; }

  .blog-hero { padding: 120px 48px 60px; border-bottom: 1px solid var(--border); }
  .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--neon); text-decoration: none; font-size: 0.85rem; margin-bottom: 32px; }
  .back-link:hover { opacity: 0.7; }
  .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--neon); font-weight: 500; margin-bottom: 16px; }
  h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(2.5rem, 4vw, 3.5rem); color: var(--white); letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 16px; }
  .hero-sub { color: var(--muted); font-size: 1.05rem; max-width: 480px; }

  .blog-grid-section { padding: 60px 48px 100px; }
  .articles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .article-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; transition: all 0.3s; display: flex; flex-direction: column; }
  .article-card:hover { border-color: rgba(168,255,120,0.3); transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.4); }
  .article-img { height: 200px; background: var(--dark3); overflow: hidden; }
  .article-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
  .article-card:hover .article-img img { transform: scale(1.05); }
  .article-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
  .article-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--neon); font-weight: 500; margin-bottom: 10px; }
  .article-title { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 1rem; color: var(--white); line-height: 1.4; margin-bottom: 12px; flex: 1; }
  .article-excerpt { font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .article-meta { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .article-meta::before { content: ''; width: 16px; height: 1px; background: var(--muted); }

  .no-articles { color: var(--muted); text-align: center; padding: 60px; }

  footer { padding: 48px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  footer p { font-size: 0.82rem; color: var(--muted); }

  @media (max-width: 768px) {
    nav { padding: 0 24px; }
    .nav-links { display: none; }
    .blog-hero { padding: 100px 24px 40px; }
    .blog-grid-section { padding: 40px 24px 60px; }
    .articles-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">EV<span>Clear</span></a>
  <ul class="nav-links">
    <li><a href="/#blog">Blog</a></li>
    <li><a href="/#guides">EV Guides</a></li>
    <li><a href="/#resources">Resources</a></li>
    <li><a href="/#about">About</a></li>
    <li><a href="/#newsletter" class="nav-cta">Free EV Guide →</a></li>
  </ul>
</nav>

<div class="blog-hero">
  <a href="/" class="back-link">← Back to EVClear</a>
  <div class="section-label">The Blog</div>
  <h1>All articles</h1>
  <p class="hero-sub">Honest EV guides, news, and advice — written for Australian buyers.</p>
</div>

<div class="blog-grid-section">
  <div class="articles-grid" id="articles-grid">
    <p style="color:var(--muted)">Loading articles...</p>
  </div>
</div>

<footer>
  <p>© 2026 EVClear. All rights reserved.</p>
  <p>Made for 🇦🇺 Australian EV buyers</p>
</footer>

<script>
  async function loadArticles() {
    try {
      const response = await fetch('/posts.json');
      if (!response.ok) throw new Error('Could not load posts');
      const posts = await response.json();
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));
const grid = document.getElementById('articles-grid');
      if (posts.length === 0) {
        grid.innerHTML = '<p class="no-articles">No articles yet. Check back soon.</p>';
        return;
      }
      grid.innerHTML = posts.map(post => `
        <a href="/posts/${post.slug}" class="article-card">
          <div class="article-img">
            <img src="${post.image || '/images/ev-transport.jpg'}" alt="${post.title}" loading="lazy">
          </div>
          <div class="article-body">
            <div class="article-tag">${post.category}</div>
            <div class="article-title">${post.title}</div>
            <div class="article-excerpt">${post.excerpt || ''}</div>
            <div class="article-meta">${post.readtime}</div>
          </div>
        </a>
      `).join('');
    } catch (error) {
      document.getElementById('articles-grid').innerHTML = '<p style="color:var(--muted);text-align:center;padding:60px">Articles coming soon.</p>';
    }
  }
  loadArticles();
</script>
</body>
</html>
